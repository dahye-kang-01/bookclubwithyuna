<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리들의 책장</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="책장">
<meta name="theme-color" content="#efe2cb">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* 레이아웃: 위 헤더(모임 이름·닉네임) → 책 표지가 선반 위에 놓인 그리드. 표지를 누르면 책 화면(큰 표지 + 글 쓰기 + 글 목록)으로 전환 */
/* 레이아웃: 따뜻한 벽지 방 → 호두나무 책장(표지가 선반 위에 꽂힘) → 마룻바닥과 러그(두 아이가 걸어다님). 한 가지 따뜻한 분위기로 고정 */
:root{
  --bg:#f0e3d2; --wall:#f0e3d2; --wall2:#dcc8b2; --surface:#fbf4e6; --fg:#2e2119; --muted:#6e5a49; --line:#dcc9a9;
  --wood-hi:#9a6036; --wood:#7a4524; --wood-lo:#4f2a14; --back:#2f1b10; --plank-hi:#b98352; --plank-lo:#7c4a26;
  --brass:#d9b36c; --cream:#f6ead2; --shelf:#d8c3a0;
  --accent:#7b3328; --accent-ink:#fff7ec; --accent-soft:#f1dccb;
  --memo:#7a5c12; --memo-bg:#f4e6bf; --op:#2f5a63; --op-bg:#dbe8e6; --rev:#6b2e4f; --rev-bg:#f1dde7;
  --rug:#8b2f2b; --rug2:#5d1f22; --rug-border:#e2c48a; --floor1:#8a5a35; --floor2:#7b4e2d;
  --danger:#a33a1c;
  --display:"Nanum Myeongjo","AppleMyungjo",serif;
  --body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--wall);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body{background-image:radial-gradient(ellipse at 50% -10%,rgba(255,214,150,.55),transparent 60%),radial-gradient(circle at 12px 12px,transparent 0,transparent 0),repeating-linear-gradient(90deg,transparent 0 13px,rgba(150,105,70,.05) 13px 14px,transparent 14px 31px,rgba(150,105,70,.04) 31px 32px,transparent 32px 56px),repeating-linear-gradient(90deg,var(--wall) 0 54px,var(--wall2) 54px 56px);background-size:100% 100%,24px 24px,auto,auto;background-attachment:fixed,scroll,scroll,scroll}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 48px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{font-family:var(--display);font-weight:800;font-size:30px;margin:0;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.count{color:var(--muted);font-size:14px;margin-top:2px}
.me{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.me b{color:var(--fg)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;color:var(--fg)}
.ghost.danger{color:var(--danger);border-color:var(--danger);font-size:14px;align-self:flex-start}
.ghost.danger.armed{background:var(--danger);color:var(--surface)}
.link{background:none;border:0;color:var(--accent);padding:4px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
/* 책장 */
.bookcase{position:relative;padding:14px 14px 10px;background:linear-gradient(90deg,var(--wood-lo),var(--wood) 6%,var(--wood-hi) 50%,var(--wood) 94%,var(--wood-lo));border-radius:4px;box-shadow:0 24px 30px -22px rgba(40,20,8,.75),inset 0 0 0 1px rgba(0,0,0,.25)}
.bookcase::before{content:"";position:absolute;left:-10px;right:-10px;top:-16px;height:18px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--plank-hi),var(--wood) 70%,var(--wood-lo));box-shadow:0 3px 4px -2px rgba(0,0,0,.4)}
.bookcase::after{content:"";position:absolute;left:-4px;right:-4px;bottom:-10px;height:12px;background:linear-gradient(180deg,var(--wood),var(--wood-lo));border-radius:0 0 3px 3px}
.shelf{--cw:124px;--ch:calc((var(--cw) - 28px) * 1.5);--rh:calc(var(--ch) + 98px);display:flex;flex-direction:column;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 3px,transparent 3px 11px),linear-gradient(180deg,#24140b,var(--back) 30%,#3a2215);box-shadow:inset 0 10px 18px -8px rgba(0,0,0,.8),inset 0 0 0 2px rgba(0,0,0,.35)}
.rowwrap{position:relative}
.shelfrow{display:flex;height:var(--rh);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scroll-padding:0 8px;padding:0 8px;scrollbar-width:thin;scrollbar-color:rgba(217,179,108,.5) transparent;background:linear-gradient(180deg,transparent 0 calc(var(--ch) + 18px),var(--plank-hi) calc(var(--ch) + 18px),var(--plank-lo) calc(var(--ch) + 32px),rgba(0,0,0,.55) calc(var(--ch) + 32px),transparent calc(var(--ch) + 40px))}
.shelfrow::-webkit-scrollbar{height:6px}.shelfrow::-webkit-scrollbar-thumb{background:rgba(217,179,108,.45);border-radius:3px}
.shelfrow .book{flex:0 0 var(--cw);scroll-snap-align:start}
.shelfrow .emptyrow{flex:1;display:flex;align-items:center;justify-content:center;height:calc(var(--ch) + 18px);color:rgba(217,179,108,.55);font-size:13px;text-align:center;padding:0 16px}
.dropgap{flex:0 0 var(--cw);height:calc(var(--ch) + 18px);display:flex;align-items:flex-end;justify-content:center;padding:18px 14px 0}
.dropgap::before{content:"";display:block;width:100%;height:var(--ch);border:2px dashed var(--brass);border-radius:5px;background:rgba(217,179,108,.12)}
.arrow{position:absolute;top:calc(var(--ch) / 2 - 4px);width:34px;height:44px;border:0;border-radius:8px;background:rgba(36,20,11,.78);color:var(--brass);font-size:22px;line-height:1;z-index:2;display:none}
.arrow.l{left:4px}.arrow.r{right:4px}
.rowwrap.can-l .arrow.l,.rowwrap.can-r .arrow.r{display:block}
@media (hover:none){.rowwrap .arrow{display:none!important}}
.book{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:pan-x pan-y}
.book img{-webkit-user-drag:none;pointer-events:none}
.book.dragging{opacity:.25}
.book.dim{opacity:.22;filter:grayscale(.6)}
.book.hit .cover{box-shadow:0 0 0 3px var(--brass),4px 6px 10px -4px rgba(0,0,0,.8)}
.cover.ghost-book{--cw:124px;--ch:144px;position:fixed;left:0;top:0;z-index:60;pointer-events:none;width:96px;height:144px;margin:0;transform-origin:50% 50%;box-shadow:0 18px 30px -10px rgba(0,0,0,.7)}
body.is-dragging{cursor:grabbing}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.searchbox{position:relative;flex:1;min-width:180px}
.searchbox input{width:100%;border:1.5px solid var(--line);border-radius:999px;padding:10px 38px 10px 38px;background:var(--surface);font-size:15px;min-height:44px}
.searchbox input:focus{outline:none;border-color:var(--wood)}
.searchbox::before{content:"";position:absolute;left:15px;top:50%;width:11px;height:11px;border:2px solid var(--muted);border-radius:50%;transform:translateY(-62%)}
.searchbox::after{content:"";position:absolute;left:26px;top:58%;width:6px;height:2px;background:var(--muted);transform:rotate(45deg)}
.searchbox button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:18px;width:32px;height:32px;border-radius:50%}
.findcount{font-size:13px;color:var(--muted);min-width:4em}
.hint{font-size:12.5px;color:var(--muted);margin:20px 2px 0}
.book{display:flex;flex-direction:column;background:none;border:0;padding:0;text-align:left;color:inherit;min-width:0;cursor:pointer}
.slot{display:block;padding:18px 14px 14px;position:relative}
.cover{position:relative;display:block;aspect-ratio:2/3;width:100%;height:var(--ch);max-width:100%;border-radius:2px 5px 5px 2px;overflow:hidden;background:#5a3a26;box-shadow:0 -1px 0 rgba(255,255,255,.08),4px 6px 10px -4px rgba(0,0,0,.8);transition:transform .2s;transform-origin:50% 100%}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.28),transparent)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-family:var(--display);font-weight:800;font-size:16px;line-height:1.3;color:var(--cream);background:linear-gradient(135deg,#6e3b2a,#4a2618);box-shadow:inset 0 0 0 3px rgba(217,179,108,.5)}
.book:hover .cover,.book:focus-visible .cover{transform:translateY(-6px) rotate(-1.5deg)}
.label{display:block;padding:8px 12px 0;height:66px;overflow:hidden}
.book .bt{color:var(--cream);font-weight:600;font-size:13.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .bn{display:block;font-size:12px;color:var(--brass);margin-top:2px}
.addcard{display:flex;width:100%;height:var(--ch);border:2px dashed rgba(217,179,108,.6);border-radius:5px;background:rgba(255,255,255,.03);flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--brass);font-weight:600}
.addcard span{font-size:34px;line-height:1;font-weight:300}
.addcard:hover{background:rgba(217,179,108,.12)}
/* 바닥과 러그 */
.floor{position:relative;height:172px;margin:10px -4px 0;border-radius:0 0 14px 14px;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 26px),repeating-linear-gradient(90deg,var(--floor1) 0 88px,rgba(0,0,0,.25) 88px 90px,var(--floor2) 90px 178px,rgba(0,0,0,.25) 178px 180px);box-shadow:inset 0 -10px 20px -12px rgba(0,0,0,.5)}
.rug{position:absolute;left:5%;right:5%;top:30px;bottom:16px;border-radius:10px;background:radial-gradient(ellipse at center,rgba(226,196,138,.9) 0 12%,transparent 13%),radial-gradient(ellipse at center,var(--rug2) 0 26%,transparent 27%),repeating-linear-gradient(45deg,rgba(226,196,138,.14) 0 6px,transparent 6px 18px),var(--rug);box-shadow:inset 0 0 0 5px var(--rug2),inset 0 0 0 8px var(--rug-border),inset 0 0 0 12px var(--rug2),0 6px 10px -6px rgba(0,0,0,.6)}
.rug::before,.rug::after{content:"";position:absolute;top:10px;bottom:10px;width:7px;background:repeating-linear-gradient(180deg,var(--rug-border) 0 2px,transparent 2px 5px)}
.rug::before{left:-7px}.rug::after{right:-7px}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.status{font-size:14px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--danger)}
/* 책 화면 */
.bookview{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:24px;align-items:start}
.bookview .left{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.bookview h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0;line-height:1.25;text-wrap:balance}
.bookview .au{color:var(--muted);font-size:15px}
.right{min-width:0;display:flex;flex-direction:column;gap:16px}
.compose{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.compose:focus-within{border-color:var(--accent)}
.types{display:flex;gap:6px;flex-wrap:wrap}
.type{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:5px 13px;font-size:14px;color:var(--muted)}
.type[aria-pressed=true]{font-weight:700;border-color:transparent}
.type[data-t="메모"][aria-pressed=true]{background:var(--memo-bg);color:var(--memo)}
.type[data-t="의견"][aria-pressed=true]{background:var(--op-bg);color:var(--op)}
.type[data-t="독후감"][aria-pressed=true]{background:var(--rev-bg);color:var(--rev)}
.type[data-t="전체"][aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.compose textarea{border:0;background:transparent;resize:vertical;min-height:96px;width:100%;line-height:1.6;font-size:16px}
.compose textarea:focus{outline:none}
.crow{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.crow input{width:110px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--bg);font-size:15px}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.note{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.note .nh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.note .nick{font-weight:700;color:var(--fg);font-size:14px}
.chip{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.chip.메모{background:var(--memo-bg);color:var(--memo)}
.chip.의견{background:var(--op-bg);color:var(--op)}
.chip.독후감{background:var(--rev-bg);color:var(--rev)}
.note .tx{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.note.long .tx{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.85}
.note .acts{display:flex;gap:4px;justify-content:flex-end}
.note .acts button{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px}
.note .acts button.armed{color:var(--danger);background:rgba(180,71,28,.12)}
.note textarea{width:100%;min-height:100px;border:1.5px solid var(--line);border-radius:8px;padding:8px;background:var(--bg);resize:vertical}
/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:90vh;overflow-y:auto;padding-top:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.field input{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:16px;min-height:44px;width:100%;min-width:0}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1;min-width:0}
.results{display:flex;flex-direction:column;gap:8px}
.res{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px}
.res img,.res .noimg{width:52px;height:76px;object-fit:cover;border-radius:3px;background:var(--shelf)}
.res b{display:block;line-height:1.35}
.res small{color:var(--muted)}
.res > div{min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;z-index:30;max-width:calc(100% - 32px)}
.setup{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;line-height:1.7}
/* 벽 장식 */
.wall{position:relative;height:118px;margin:4px 0 6px;display:flex;align-items:flex-start;justify-content:center;gap:14px;pointer-events:none}
.frames{display:flex;align-items:flex-start;gap:12px;margin-top:6px}
.frames svg{display:block;filter:drop-shadow(0 6px 6px rgba(70,40,20,.28))}
.frames svg:nth-child(2){margin-top:14px}.frames svg:nth-child(3){margin-top:2px}.frames svg:nth-child(4){margin-top:18px}
.hang{position:absolute;left:4%;top:-26px;transform-origin:50% 0;animation:sway 6s ease-in-out infinite alternate}
.lamp{position:absolute;right:5%;top:8px}
.lamp::before{content:"";position:absolute;left:50%;top:30px;width:150px;height:120px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 20%,rgba(255,205,120,.55),transparent 65%);pointer-events:none}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
/* 바닥 소품 */
.plant{position:absolute;left:-14px;bottom:8px;z-index:2;pointer-events:none;transform-origin:50% 100%;animation:leaf 7s ease-in-out infinite alternate}
.teatable{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:1;pointer-events:none}
.cushion{position:absolute;right:7%;bottom:24px;z-index:1;pointer-events:none}
@keyframes leaf{from{transform:rotate(-1deg)}to{transform:rotate(1.2deg)}}
/* 강아지 */
.dog{position:absolute;left:0;bottom:0;width:64px;height:46px;pointer-events:auto;cursor:pointer;z-index:3;will-change:transform;-webkit-tap-highlight-color:transparent}
.dog svg{width:64px;height:46px;display:block;overflow:visible;transition:transform .15s}
.dog .tail{transform-box:view-box;transform-origin:14px 24px}
.dog .legs rect{transform-box:fill-box;transform-origin:50% 0}
.dog .head{transform-box:view-box;transform-origin:44px 27px;transition:transform .35s}
.dog .bodyg{transform-box:view-box;transform-origin:32px 42px;transition:transform .35s}
.dog .legs{transform-box:view-box;transform-origin:32px 42px;transition:transform .35s}
.dog .ec,.dog .tongue{display:none}
.dog.sleep .eo{display:none}.dog.sleep .ec{display:inline}
.dog.run .tongue,.dog.sit .tongue,.dog.happy .tongue{display:inline}
.dog.sleep .legs{transform:scaleY(.2)}
.dog.sleep .bodyg{transform:translateY(7px);animation:breath 2.6s ease-in-out infinite}
.dog.sleep .head{transform:translate(-3px,9px) rotate(14deg)}
.dog.sit .legs .lb1,.dog.sit .legs .lb2{transform:scaleY(.45)}
.dog.sit .bodyg{transform:rotate(-12deg) translateY(2px)}
.dog.sit .tail,.dog.walk .tail,.dog.happy .tail{animation:wag .22s ease-in-out infinite alternate}
.dog.run .tail{animation:wag .12s ease-in-out infinite alternate}
.dog.walk .lf1,.dog.walk .lb2{animation:dleg .32s ease-in-out infinite alternate}
.dog.walk .lf2,.dog.walk .lb1{animation:dleg .32s ease-in-out infinite alternate-reverse}
.dog.run .lf1,.dog.run .lb2{animation:dleg .16s ease-in-out infinite alternate}
.dog.run .lf2,.dog.run .lb1{animation:dleg .16s ease-in-out infinite alternate-reverse}
.dog.run .bodyall{animation:bob .14s ease-in-out infinite alternate}
.dog.happy .bodyall{animation:hop .3s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-22deg)}to{transform:rotate(26deg)}}
@keyframes dleg{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
@keyframes breath{0%,100%{transform:translateY(7px) scaleY(1)}50%{transform:translateY(7px) scaleY(1.05)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.zzz{position:absolute;right:-6px;top:-6px;font:800 13px var(--display);color:var(--muted);display:none}
.zzz span{position:absolute;opacity:0;animation:zz 2.7s infinite}
.zzz span:nth-child(2){animation-delay:.9s;font-size:15px}.zzz span:nth-child(3){animation-delay:1.8s;font-size:18px}
.dog.sleep .zzz{display:block}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(10px,-22px)}}
.dog .bubble{bottom:48px}
.ball{position:absolute;left:0;bottom:0;width:14px;height:14px;z-index:3;transition:transform .9s cubic-bezier(.25,.8,.35,1);pointer-events:none}
.ball i{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#f2b33d 55%,#c97d1a);box-shadow:0 2px 2px rgba(0,0,0,.3)}

<script type="module">
const V="10.12.2";
const $=id=>document.getElementById(id);
const CFG=window.BOOKCLUB||{};
const TYPES=["메모","의견","독후감"];
let db,F,uid=null,nick="",books=[],unsubNotes=null,notes=[],current=null,noteFilter="전체",composeType="메모";

/* ---------- 작은 도우미 ---------- */
function el(tag,attrs,kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null)continue;if(k==="text")e.textContent=v;else if(k.startsWith("on"))e[k]=v;else e.setAttribute(k,v);}(kids||[]).forEach(c=>c&&e.appendChild(typeof c==="string"?document.createTextNode(c):c));return e;}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600);}
function setStatus(m,err){const s=$("status");s.textContent=m||"";s.classList.toggle("err",!!err);}
function when(ts){if(!ts||!ts.toDate)return "방금";const d=ts.toDate(),n=new Date(),diff=(n-d)/1000;
  if(diff<60)return "방금";if(diff<3600)return Math.floor(diff/60)+"분 전";if(diff<86400)return Math.floor(diff/3600)+"시간 전";
  return (d.getFullYear()!==n.getFullYear()?d.getFullYear()+". ":"")+(d.getMonth()+1)+". "+d.getDate()+".";}
function safeUrl(u){if(!u)return "";u=String(u).trim().replace(/^http:\/\//,"https://");return /^https:\/\//.test(u)?u:"";}
function coverEl(b,cls){
  const c=el("span",{class:cls||"cover"});
  const url=safeUrl(b.cover);
  const ph=el("div",{class:"ph",text:b.title||""});
  if(url){const img=el("img",{src:url,alt:"",loading:"lazy",referrerpolicy:"no-referrer"});img.onerror=()=>{img.remove();c.appendChild(ph);};c.appendChild(img);}
  else c.appendChild(ph);
  return c;
}
function getNick(){try{return localStorage.getItem("bookclub-nick")||"";}catch(e){return "";}}
function putNick(n){try{localStorage.setItem("bookclub-nick",n);}catch(e){}}

/* ---------- 시트 ---------- */
function openSheet(title,build,{closable=true}={}){
  const box=$("sheet-in");box.textContent="";
  box.appendChild(el("div",{class:"head"},[el("h3",{text:title}),closable?el("button",{class:"ghost",type:"button",text:"닫기",onclick:closeSheet}):null]));
  build(box);$("scrim").hidden=false;$("sheet").hidden=false;$("sheet").scrollTop=0;
  $("scrim").onclick=closable?closeSheet:null;
}
function closeSheet(){$("scrim").hidden=true;$("sheet").hidden=true;}

/* ---------- 닉네임 ---------- */
function askNick(first){
  openSheet(first?"닉네임을 정해 주세요":"닉네임 바꾸기",box=>{
    box.appendChild(el("p",{class:"count",text:"모임 친구들에게 이 이름으로 보여요. 나중에 바꿀 수 있어요."}));
    const inp=el("input",{id:"nick-in",maxlength:"16",autocomplete:"off",placeholder:"예: 다혜",value:nick});
    box.appendChild(el("label",{class:"field",for:"nick-in"},["닉네임",inp]));
    const go=el("button",{class:"btn",type:"button",text:"저장"});
    const done=()=>{const v=inp.value.trim().replace(/\s+/g," ");if(!v){inp.focus();return;}
      nick=v;putNick(v);$("my-nick").textContent=v;$("me").hidden=false;closeSheet();
      if(!first)toast("앞으로 쓰는 글은 '"+v+"'(으)로 보여요.");};
    go.onclick=done;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();done();}};
    box.appendChild(go);setTimeout(()=>inp.focus(),50);
  },{closable:!first});
}
$("b-nick").onclick=()=>askNick(false);

/* ---------- 책장 ---------- */
const SHELVES=3;
let findQ="",drag=null,suppressClick=false,renderPending=false;
const ordOf=b=>typeof b.order==="number"?b.order:-((b.createdAt&&b.createdAt.seconds)||Date.now()/1000);
function layoutRows(){
  const rows=Array.from({length:SHELVES},()=>[]);
  const sorted=books.slice().sort((a,b)=>ordOf(a)-ordOf(b));
  const loose=[];
  sorted.forEach(b=>{const k=b.shelf;if(Number.isInteger(k)&&k>=0&&k<SHELVES)rows[k].push(b);else loose.push(b);});
  loose.reverse().forEach(b=>{let m=0;for(let i=1;i<SHELVES;i++)if(rows[i].length<rows[m].length)m=i;rows[m].push(b);});
  rows.forEach(r=>r.sort((a,b)=>ordOf(a)-ordOf(b)));
  return rows;
}
function matches(b){if(!findQ)return true;const t=((b.title||"")+" "+(b.author||"")).toLowerCase();return t.includes(findQ);}
function renderShelf(){
  if(drag){renderPending=true;return;}
  const s=$("shelf");const keep=[...s.querySelectorAll(".shelfrow")].map(r=>r.scrollLeft);
  s.textContent="";
  $("count").textContent=books.length?"함께 읽은 책 "+books.length+"권":"";
  const rows=layoutRows();
  rows.forEach((list,ri)=>{
    const row=el("div",{class:"shelfrow","data-shelf":String(ri)});
    if(!list.length)row.appendChild(el("div",{class:"emptyrow",text:books.length?"빈 선반이에요. 책을 꾹 눌러 여기로 옮겨 보세요.":(ri===0?"아직 책이 없어요. 위의 '+ 책 추가'로 첫 책을 올려 보세요.":"")}));
    list.forEach(b=>{
      const btn=el("button",{class:"book"+(findQ?(matches(b)?" hit":" dim"):""),type:"button","aria-label":b.title+" 열기","data-id":b.id},[
        el("span",{class:"slot"},[coverEl(b)]),
        el("span",{class:"label"},[el("span",{class:"bt",text:b.title}),el("span",{class:"bn",text:(b.noteCount?"글 "+b.noteCount+"개":"아직 글 없음")})])
      ]);
      btn.querySelectorAll("img").forEach(i=>i.setAttribute("draggable","false"));
      btn.onclick=()=>{if(suppressClick)return;pullBook(btn,b.id);};
      btn.oncontextmenu=e=>e.preventDefault();
      attachDrag(btn,b);
      row.appendChild(btn);
    });
    const wrap=el("div",{class:"rowwrap"},[row]);
    const L=el("button",{class:"arrow l",type:"button","aria-label":"선반 왼쪽으로",text:"‹"}),R=el("button",{class:"arrow r",type:"button","aria-label":"선반 오른쪽으로",text:"›"});
    L.onclick=()=>row.scrollBy({left:-row.clientWidth*0.8,behavior:"smooth"});R.onclick=()=>row.scrollBy({left:row.clientWidth*0.8,behavior:"smooth"});
    wrap.append(L,R);
    const upd=()=>{wrap.classList.toggle("can-l",row.scrollLeft>4);wrap.classList.toggle("can-r",row.scrollLeft+row.clientWidth<row.scrollWidth-4);};
    row.addEventListener("scroll",upd,{passive:true});
    s.appendChild(wrap);
    if(keep[ri])row.scrollLeft=keep[ri];
    requestAnimationFrame(upd);
  });
  updateFind(false);
}
window.addEventListener("resize",()=>document.querySelectorAll(".shelfrow").forEach(r=>r.dispatchEvent(new Event("scroll"))));

/* ---------- 책장에서 찾기 ---------- */
function updateFind(scroll){
  const n=findQ?books.filter(matches).length:0;
  $("findcount").textContent=findQ?(n?n+"권 찾음":"없어요"):"";
  $("find-x").hidden=!findQ;
  if(scroll&&findQ){
    let first=null;
    document.querySelectorAll(".shelfrow").forEach(row=>{const hit=row.querySelector(".book.hit");if(hit){row.scrollTo({left:Math.max(0,hit.offsetLeft-row.clientWidth/2+hit.offsetWidth/2),behavior:"smooth"});if(!first)first=hit;}});
    if(first)first.closest(".rowwrap").scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}
$("find").addEventListener("input",()=>{findQ=$("find").value.trim().toLowerCase();renderShelf();updateFind(true);});
$("find-x").onclick=()=>{$("find").value="";findQ="";renderShelf();$("find").focus();};
$("b-add").onclick=()=>openAddBook();

/* ---------- 꾹 눌러 끌어서 옮기기 ---------- */
document.addEventListener("touchmove",e=>{if(drag)e.preventDefault();},{passive:false});
function attachDrag(btn,b){
  btn.addEventListener("pointerdown",e=>{
    if(e.button>0||!db)return;
    const sx=e.clientX,sy=e.clientY,pid=e.pointerId,mouse=e.pointerType==="mouse";
    let timer=null,started=false;
    const begin=(x,y)=>{started=true;startDrag(btn,b,x,y);if(navigator.vibrate)try{navigator.vibrate(15);}catch(_){}};
    if(!mouse)timer=setTimeout(()=>begin(sx,sy),380);
    const move=ev=>{
      if(ev.pointerId!==pid)return;
      if(!started){
        const d=Math.hypot(ev.clientX-sx,ev.clientY-sy);
        if(mouse){if(d>7)begin(ev.clientX,ev.clientY);else return;}
        else{if(d>9){clearTimeout(timer);cleanup();}return;}
      }
      ev.preventDefault();moveDrag(ev.clientX,ev.clientY);
    };
    const up=ev=>{if(ev.pointerId!==pid)return;clearTimeout(timer);cleanup();if(started)endDrag(ev.type==="pointercancel");};
    function cleanup(){window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);}
    window.addEventListener("pointermove",move,{passive:false});
    window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
  });
}
function startDrag(btn,b,x,y){
  const cover=btn.querySelector(".cover");
  const ghost=cover.cloneNode(true);ghost.classList.add("ghost-book");
  const cs=getComputedStyle($("shelf"));ghost.style.width=(parseFloat(cs.getPropertyValue("--cw"))-28)+"px";ghost.style.height=((parseFloat(cs.getPropertyValue("--cw"))-28)*1.5)+"px";document.body.appendChild(ghost);
  btn.classList.add("dragging");document.body.classList.add("is-dragging");
  const gap=el("div",{class:"dropgap"});
  drag={b,btn,ghost,gap,row:null,index:-1,x,y,timer:null};
  drag.timer=setInterval(autoScroll,16);
  moveDrag(x,y);
}
function moveDrag(x,y){
  if(!drag)return;drag.x=x;drag.y=y;
  const g=drag.ghost,w=g.offsetWidth,h=g.offsetHeight;
  g.style.transform="translate("+(x-w/2)+"px,"+(y-h*0.6)+"px) rotate(4deg) scale(1.06)";
  const rows=[...document.querySelectorAll(".shelfrow")];
  const box=$("shelf").getBoundingClientRect();
  let target=null;
  if(x>=box.left-30&&x<=box.right+30&&y>=box.top-40&&y<=box.bottom+40){
    let best=1e9;rows.forEach(r=>{const rc=r.getBoundingClientRect();const d=y<rc.top?rc.top-y:y>rc.bottom?y-rc.bottom:0;if(d<best){best=d;target=r;}});
  }
  if(!target){drag.gap.remove();drag.row=null;drag.index=-1;return;}
  const items=[...target.querySelectorAll(".book:not(.dragging)")];
  let idx=items.length;
  for(let i=0;i<items.length;i++){const rc=items[i].getBoundingClientRect();if(x<rc.left+rc.width/2){idx=i;break;}}
  if(drag.row!==target||drag.index!==idx){
    const empty=target.querySelector(".emptyrow");if(empty)empty.hidden=true;
    if(drag.row&&drag.row!==target){const e2=drag.row.querySelector(".emptyrow");if(e2)e2.hidden=false;}
    if(idx<items.length)target.insertBefore(drag.gap,items[idx]);else target.appendChild(drag.gap);
    drag.row=target;drag.index=idx;
  }
}
function autoScroll(){
  if(!drag||!drag.row)return;
  const rc=drag.row.getBoundingClientRect(),edge=48;
  if(drag.x<rc.left+edge)drag.row.scrollLeft-=10;
  else if(drag.x>rc.right-edge)drag.row.scrollLeft+=10;
}
async function endDrag(cancel){
  const d=drag;if(!d)return;
  clearInterval(d.timer);d.ghost.remove();d.gap.remove();
  d.btn.classList.remove("dragging");document.body.classList.remove("is-dragging");
  drag=null;suppressClick=true;setTimeout(()=>suppressClick=false,80);
  if(cancel||!d.row){if(renderPending){renderPending=false;}renderShelf();return;}
  const shelf=Number(d.row.dataset.shelf);
  const list=layoutRows()[shelf].filter(x=>x.id!==d.b.id);
  const prev=list[d.index-1],next=list[d.index];
  let order;
  if(prev&&next)order=(ordOf(prev)+ordOf(next))/2;
  else if(prev)order=ordOf(prev)+1;
  else if(next)order=ordOf(next)-1;
  else order=ordOf(d.b);
  const before=layoutRows()[shelf].filter(x=>x.id!==d.b.id);
  const sameSpot=d.b.shelf===shelf&&layoutRows()[shelf].indexOf(d.b)===d.index;
  const old={shelf:d.b.shelf,order:d.b.order};
  d.b.shelf=shelf;d.b.order=order;renderPending=false;renderShelf();
  if(sameSpot)return;
  try{await F.updateDoc(F.doc(db,"books",d.b.id),{shelf,order});}
  catch(e){d.b.shelf=old.shelf;d.b.order=old.order;renderShelf();toast("옮기지 못했어요. Firebase 규칙을 새 버전으로 바꿨는지 확인해 주세요.");}
}

/* ---------- 책 추가 (Google 도서 검색) ---------- */
async function searchGoogle(term){
  const key=CFG.booksApiKey?"&key="+encodeURIComponent(CFG.booksApiKey):"";
  const r=await fetch("https://www.googleapis.com/books/v1/volumes?maxResults=12&printType=books&q="+encodeURIComponent(term)+key);
  if(!r.ok)throw new Error(r.status+(key?"·키 사용":"·키 없음"));
  const j=await r.json();
  return (j.items||[]).map(it=>{const v=it.volumeInfo||{};const img=v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail);
    return {title:(v.title||"")+(v.subtitle?" : "+v.subtitle:""),author:(v.authors||[]).join(", "),
      meta:[(v.authors||[]).join(", "),v.publisher,(v.publishedDate||"").slice(0,4)].filter(Boolean).join(" · "),
      cover:img?safeUrl(img).replace("&edge=curl",""):""};});
}
async function searchOpenLibrary(term){
  const r=await fetch("https://openlibrary.org/search.json?limit=12&q="+encodeURIComponent(term));
  if(!r.ok)throw new Error(String(r.status));
  const j=await r.json();
  return (j.docs||[]).map(d=>({title:d.title||"",author:(d.author_name||[]).join(", "),
    meta:[(d.author_name||[]).join(", "),d.first_publish_year].filter(Boolean).join(" · "),
    cover:d.cover_i?"https://covers.openlibrary.org/b/id/"+d.cover_i+"-M.jpg":""}));
}

async function start(){
  if(CFG.clubName){$("club").textContent=CFG.clubName;document.title=CFG.clubName;}
  const fc=CFG.firebase||{};
  if(!fc.apiKey||!fc.projectId||String(fc.apiKey).includes("여기에")){
    $("home").textContent="";
    $("home").appendChild(el("div",{class:"setup"},[el("b",{text:"아직 저장소가 연결되지 않았어요."}),el("br"),"config.js 파일에 Firebase 설정을 붙여넣은 뒤 다시 올려 주세요."]));
    return;
  }
  nick=getNick();
  if(nick){$("my-nick").textContent=nick;$("me").hidden=false;}
  setStatus("책장을 불러오는 중…");
  try{
    const [app,auth,fs]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)]);
    F=fs;
    const a=app.initializeApp(fc);
    db=CFG.databaseId?fs.getFirestore(a,CFG.databaseId):fs.getFirestore(a);
    const au=auth.getAuth(a);
    await new Promise((res,rej)=>{
      auth.onAuthStateChanged(au,u=>{if(u){uid=u.uid;res();}});
      auth.signInAnonymously(au).catch(rej);
    });
    fs.onSnapshot(fs.query(fs.collection(db,"books"),fs.orderBy("createdAt","desc")),snap=>{
      books=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      setStatus("");
      if(current){const nb=books.find(x=>x.id===current.id);if(nb){current=nb;renderBookHead();}else{go("");}}
      if($("bookpage").hidden)renderShelf();
      if(!current&&location.hash)route();
    },()=>setStatus("책장을 불러오지 못했어요. 새로고침해 주세요.",true));
    if(!nick)askNick(true);
    route();
  }catch(e){
    setStatus("저장소에 연결하지 못했어요. 인터넷 연결과 Firebase 설정(익명 로그인 사용)을 확인해 주세요.",true);
  }
}

    <path d="M24 43 Q30 49 36 43" fill="none" stroke="${o.accent}" stroke-width="2"/>
    <g class="book-prop"><rect x="20" y="49" width="20" height="14" rx="1.5" fill="${o.book}"/><line x1="30" y1="49" x2="30" y2="63" stroke="rgba(0,0,0,.25)" stroke-width="1"/></g>
    <g class="head">
      <rect x="27" y="37" width="6" height="7" fill="${o.skin}"/>
      <circle cx="30" cy="26" r="14" fill="${o.skin}"/>
      ${bangs}
      <g class="eyes-open" fill="#2b2420"><circle cx="25" cy="27.5" r="1.9"/><circle cx="35" cy="27.5" r="1.9"/></g>
      <g class="eyes-happy" fill="none" stroke="#2b2420" stroke-width="1.6" stroke-linecap="round"><path d="M22.8 28 Q25 25 27.2 28"/><path d="M32.8 28 Q35 25 37.2 28"/></g>
      <ellipse cx="21.5" cy="31.5" rx="2.6" ry="1.5" fill="#f2a3a3" opacity=".7"/><ellipse cx="38.5" cy="31.5" rx="2.6" ry="1.5" fill="#f2a3a3" opacity=".7"/>
      <path class="mouth-smile" d="M27 32.5 Q30 35 33 32.5" fill="none" stroke="#8a3b3b" stroke-width="1.4" stroke-linecap="round"/>
      <path class="mouth-laugh" d="M26.5 31.8 Q30 38 33.5 31.8 Z" fill="#8a2f3c"/>
    </g>
  </g>
</svg>`;
}
const LINES={talk:["이 책 읽어봤어?","다음 책 뭐 읽지?","완전 공감!","여기 밑줄 쳤어","오늘 모임 몇 시야?"],laugh:["ㅋㅋㅋㅋ","히히","아 웃겨 ㅋㅋ","진짜?! ㅋㅋ"],read:["음…","이 문장 좋다","한 장만 더…"]};
const pick=a=>a[Math.floor(Math.random()*a.length)];
function startScene(){
  const scene=$("scene");if(!scene)return;
  const specs=[
    {style:"long",hair:"#4a2f22",skin:"#f6d7c3",dress:"#e7a5b8",accent:"#fff3f6",shoe:"#5b3a4a",book:"#7fb6c9"},
    {style:"bun",hair:"#2c2523",skin:"#f3d2bb",dress:"#9cc3a6",accent:"#f7e08a",shoe:"#3d4a40",book:"#f0c46c"}];
  const G=specs.map((sp,i)=>{
    const el=document.createElement("div");el.className="girl idle";el.innerHTML=girlSVG(sp);
    const bub=document.createElement("div");bub.className="bubble";el.appendChild(bub);
    scene.appendChild(el);
    const g={el,bub,svg:el.querySelector("svg"),x:0,dir:i?-1:1,state:"idle",until:0,target:0,bt:0};
    el.addEventListener("click",()=>{setState(g,"laugh",performance.now(),1800);say(g,pick(LINES.laugh.concat(LINES.talk)));});
    return g;
  });
  let W=Math.max(76,scene.clientWidth-76);
  G[0].x=W*0.2;G[1].x=W*0.65;
  function say(g,t){g.bub.textContent=t;g.bub.classList.toggle("l",g.x<70);g.bub.classList.toggle("r",g.x>W-70);g.bub.classList.add("on");clearTimeout(g.bt);g.bt=setTimeout(()=>g.bub.classList.remove("on"),1900);}
  function setState(g,st,now,ms){g.state=st;g.until=now+ms;g.el.className="girl "+st;}
  function face(g,d){g.dir=d;g.svg.style.transform="scaleX("+d+")";}
  function place(g){g.el.style.transform="translateX("+g.x.toFixed(1)+"px)";}
  function decide(g,o,now){
    const near=Math.abs(g.x-o.x)<120,r=Math.random();
    if(near&&r<0.4&&o.state!=="walk"){
      face(g,o.x>g.x?1:-1);face(o,g.x>o.x?1:-1);
      setState(g,"laugh",now,2200);setState(o,"laugh",now,2200);
      say(g,pick(LINES.talk));setTimeout(()=>say(o,pick(LINES.laugh)),700);
    }else if(Math.abs(g.x+38-(dog.x+32))<110&&dog.state!=="sleep"&&r<0.55){face(g,dog.x+32>g.x+38?1:-1);setState(g,"laugh",now,1800);say(g,pick(["강아지 귀여워!","이리 와~","공 던져줄까?"]));}
    else if(r<0.6){setState(g,"read",now,2600+Math.random()*2600);if(Math.random()<.4)say(g,pick(LINES.read));}
    else if(r<0.72){setState(g,"idle",now,1200+Math.random()*1800);}
    else{g.target=Math.random()*W;face(g,g.target>g.x?1:-1);setState(g,"walk",now,99999);}
  }
  /* --- 강아지 --- */
  const dogSVG=`<svg viewBox="0 0 64 46" aria-hidden="true"><ellipse cx="32" cy="44" rx="20" ry="2.5" fill="rgba(0,0,0,.15)"/>
  <g class="bodyall">
   <g class="tail"><path d="M15 24 Q5 19 8 10" fill="none" stroke="#e8c79d" stroke-width="5" stroke-linecap="round"/></g>
   <g class="legs"><rect class="lb1" x="16" y="30" width="5" height="12" rx="2.5" fill="#e3c193"/><rect class="lb2" x="22" y="30" width="5" height="12" rx="2.5" fill="#efd3ac"/><rect class="lf1" x="38" y="30" width="5" height="12" rx="2.5" fill="#e3c193"/><rect class="lf2" x="44" y="30" width="5" height="12" rx="2.5" fill="#efd3ac"/></g>
   <g class="bodyg"><ellipse cx="31" cy="27" rx="18" ry="10" fill="#f5e0bf"/><ellipse cx="25" cy="23" rx="7" ry="4" fill="#e8c79d" opacity=".75"/></g>
   <g class="head">
    <rect x="40" y="25" width="11" height="3.6" rx="1.6" fill="#c0392b"/><circle cx="45.5" cy="30" r="1.9" fill="#f2c94c"/>
    <circle cx="50" cy="17" r="11" fill="#f5e0bf"/>
    <ellipse cx="43.5" cy="16" rx="4.2" ry="8.5" fill="#c99566" transform="rotate(22 43.5 16)"/>
    <ellipse cx="58" cy="21" rx="6.2" ry="4.6" fill="#fff4e3"/>
    <ellipse cx="62" cy="19.4" rx="2" ry="1.6" fill="#3a2a22"/>
    <g class="eo"><circle cx="53" cy="14.5" r="1.7" fill="#2b2420"/><circle cx="53.5" cy="14" r=".5" fill="#fff"/></g>
    <path class="ec" d="M50.8 15 Q53 16.8 55.2 15" stroke="#2b2420" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path class="tongue" d="M57.5 24 q1.6 4.5 3.2 0 z" fill="#e8737a"/>
    <ellipse cx="53" cy="20.5" rx="2.2" ry="1.3" fill="#f2a3a3" opacity=".7"/>
   </g></g></svg>`;
  const DOGW=64;
  const dogEl=document.createElement("div");dogEl.className="dog sleep";dogEl.innerHTML=dogSVG+'<div class="zzz"><span>z</span><span>z</span><span>Z</span></div>';
  const dbub=document.createElement("div");dbub.className="bubble";dogEl.appendChild(dbub);
  scene.appendChild(dogEl);
  const ball=document.createElement("div");ball.className="ball";ball.hidden=true;ball.innerHTML="<i></i>";scene.appendChild(ball);
  const DW=()=>Math.max(DOGW,scene.clientWidth-DOGW);
  const dog={el:dogEl,svg:dogEl.querySelector("svg"),x:DW()*0.45,dir:1,state:"sleep",until:performance.now()+5000,target:0,bub:dbub,bt:0,ballX:0,throws:0};
  function dset(st,now,ms){dog.state=st;dog.until=now+ms;dog.el.className="dog "+st;}
  function dface(d){dog.dir=d;dog.svg.style.transform="scaleX("+d+")";}
  function dplace(){dog.el.style.transform="translateX("+dog.x.toFixed(1)+"px)";}
  function dsay(t){dbub.textContent=t;dbub.classList.toggle("l",dog.x<60);dbub.classList.toggle("r",dog.x>DW()-60);dbub.classList.add("on");clearTimeout(dog.bt);dog.bt=setTimeout(()=>dbub.classList.remove("on"),1500);}
  function throwBall(fromX){
    const w=scene.clientWidth-14;let bx;
    do{bx=Math.random()*w;}while(Math.abs(bx-fromX)<90&&w>200);
    dog.ballX=bx;ball.hidden=false;ball.classList.remove("hop");void ball.offsetWidth;ball.classList.add("hop");
    ball.style.transform="translateX("+bx.toFixed(1)+"px)";
    const tgt=bx>dog.x?bx-DOGW+6:bx+2;dog.target=Math.max(0,Math.min(DW(),tgt));dface(dog.target>dog.x?1:-1);
  }
  function ddecide(now){
    const r=Math.random();
    if(r<0.22){dset("sleep",now,7000+Math.random()*6000);}
    else if(r<0.55){
      dog.throws=2+Math.floor(Math.random()*3);ball.style.transition="none";ball.style.transform="translateX("+(dog.x+(dog.dir>0?DOGW-4:-10)).toFixed(1)+"px)";void ball.offsetWidth;ball.style.transition="";
      dsay("멍!");throwBall(dog.x);dset("run",now,99999);
    }else if(r<0.8){dog.target=Math.random()*DW();dface(dog.target>dog.x?1:-1);dset("walk",now,99999);}
    else{dset("sit",now,1800+Math.random()*1800);if(Math.random()<.5)dsay(pick(["멍멍!","왈!","헥헥"]));}
  }
  dogEl.addEventListener("click",()=>{const now=performance.now();
    if(dog.state==="sleep"){dset("sit",now,2200);dsay("…멍?");}
    else{dset("happy",now,1400);dsay(pick(["멍멍!","왈왈!","♡"]));}
  });
  dface(1);dplace();
  G.forEach(g=>{face(g,g.dir);place(g);});
  if(REDUCED){G.forEach(g=>g.el.className="girl idle");return;}
  let last=performance.now();
  function loop(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    if(!$("home").hidden&&!document.hidden){
      W=Math.max(76,scene.clientWidth-76);
      G.forEach((g,i)=>{
        const o=G[1-i];
        if(g.state==="walk"){
          const step=38*dt*g.dir;g.x+=step;
          if((g.dir>0&&g.x>=g.target)||(g.dir<0&&g.x<=g.target)||g.x<0||g.x>W){g.x=Math.max(0,Math.min(W,g.x));decide(g,o,now);}
          place(g);
        }else if(now>g.until){decide(g,o,now);}
      });
      const dw=DW();
      if(dog.state==="walk"||dog.state==="run"){
        const sp=(dog.state==="run"?105:46)*dt*dog.dir;dog.x+=sp;
        if((dog.dir>0&&dog.x>=dog.target)||(dog.dir<0&&dog.x<=dog.target)||dog.x<0||dog.x>dw){
          dog.x=Math.max(0,Math.min(dw,dog.x));
          if(dog.state==="run"&&dog.throws>0){dog.throws--;
            if(dog.throws>0){throwBall(dog.x);}
            else{ball.hidden=true;dset("sit",now,2200);dsay(pick(["헥헥","멍!"]));}
          }else{ddecide(now);}
        }
        dplace();
      }else if(now>dog.until){ddecide(now);}
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

renderShelf();
startScene();
start();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
